<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин парфюмерии</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #006A4E, #004d38); /* RAL 6016 */
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.8s ease-out;
        }
        .product {
            perspective: 1000px;
            transition: transform 0.4s ease;
        }
        .product-inner {
            transform-style: preserve-3d;
            transition: transform 0.4s ease;
        }
        .product:hover .product-inner {
            transform: rotateY(10deg) scale(1.05);
        }
        .product img {
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
        }
        .carousel {
            overflow: hidden;
            position: relative;
        }
        .carousel-inner {
            display: flex;
            transition: transform 0.5s ease;
        }
        .carousel-item {
            min-width: 100%;
            box-sizing: border-box;
        }
        .btn-slide {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            padding: 10px;
            border-radius: 50%;
            color: white;
        }
        .btn-slide:hover {
            background: rgba(255,255,255,0.4);
        }
        .nav-button {
            transition: transform 0.2s;
        }
        .nav-button:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body class="min-h-screen">
    <div id="particles-js"></div>
    <div class="container mx-auto p-4 max-w-5xl relative">
        <!-- Главная страница -->
        <div id="home" class="bg-white bg-opacity-10 backdrop-blur-lg rounded-lg shadow-2xl p-6 mb-6 animate-fadeIn">
            <h1 class="text-4xl font-extrabold text-center mb-6 drop-shadow-lg">Топ-10 ароматов</h1>
            <div class="carousel">
                <div id="carousel-inner" class="carousel-inner"></div>
                <button onclick="slide(-1)" class="btn-slide left-0">❮</button>
                <button onclick="slide(1)" class="btn-slide right-0">❯</button>
            </div>
        </div>

        <!-- Каталог -->
        <div id="catalog" class="bg-white bg-opacity-10 backdrop-blur-lg rounded-lg shadow-2xl p-6 mb-6 hidden animate-fadeIn">
            <h1 class="text-4xl font-extrabold text-center mb-6 drop-shadow-lg">Каталог</h1>
            <div class="flex flex-col sm:flex-row gap-4 mb-4">
                <input type="text" id="search" class="bg-white bg-opacity-20 border-none rounded-md p-3 flex-1 text-white placeholder-gray-300" placeholder="Поиск по названию или описанию" oninput="filterProducts()">
                <select id="category" class="bg-white bg-opacity-20 border-none rounded-md p-3 text-white" onchange="filterProducts()">
                    <option value="">Все категории</option>
                    <option value="men's">Мужские</option>
                    <option value="women's">Женские</option>
                    <option value="unisex">Унисекс</option>
                </select>
            </div>
            <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
        </div>

        <!-- Детали товара -->
        <div id="product-details" class="bg-white bg-opacity-10 backdrop-blur-lg rounded-lg shadow-2xl p-6 mb-6 hidden animate-fadeIn">
            <button onclick="backToCatalog()" class="bg-gradient-to-r from-gray-400 to-gray-600 text-white px-4 py-2 rounded-full mb-4">Назад</button>
            <div id="product-info"></div>
        </div>

        <!-- Корзина -->
        <div id="cart" class="bg-white bg-opacity-10 backdrop-blur-lg rounded-lg shadow-2xl p-6 mb-6 hidden animate-fadeIn">
            <h1 class="text-4xl font-extrabold text-center mb-6 drop-shadow-lg">Корзина</h1>
            <div id="cart-items" class="space-y-4"></div>
            <button onclick="sendOrder()" class="bg-gradient-to-r from-green-400 to-green-600 text-white px-6 py-3 rounded-full mt-6 w-full hover:from-green-500 hover:to-green-700 transition transform hover:scale-105">Отправить заказ</button>
        </div>

        <!-- Админ-панель -->
        <div id="admin" class="bg-white bg-opacity-10 backdrop-blur-lg rounded-lg shadow-2xl p-6 mb-6 hidden animate-fadeIn">
            <h1 class="text-4xl font-extrabold text-center mb-6 drop-shadow-lg">Админ-панель</h1>
            <input type="password" id="admin-password" class="bg-white bg-opacity-20 border-none rounded-md p-3 w-full mb-4 text-white placeholder-gray-300" placeholder="Пароль">
            <button onclick="loginAdmin()" class="bg-gradient-to-r from-blue-400 to-blue-600 text-white px-6 py-3 rounded-full w-full hover:from-blue-500 hover:to-blue-700 transition transform hover:scale-105">Войти</button>
            <div id="admin-content" class="hidden mt-6">
                <h2 class="text-2xl font-bold text-white mb-4">Поиск товара</h2>
                <input type="text" id="admin-search" class="bg-white bg-opacity-20 border-none rounded-md p-3 w-full mb-4 text-white placeholder-gray-300" placeholder="Введите название товара" oninput="searchAdminProducts()">
                <div id="admin-products" class="space-y-4"></div>
                <h2 class="text-2xl font-bold text-white mt-6 mb-4">Добавить/Редактировать товар</h2>
                <input type="text" id="product-name" class="bg-white bg-opacity-20 border-none rounded-md p-3 w-full mb-4 text-white placeholder-gray-300" placeholder="Название">
                <select id="product-category" class="bg-white bg-opacity-20 border-none rounded-md p-3 w-full mb-4 text-white">
                    <option value="">Выберите категорию</option>
                    <option value="men's">Мужские</option>
                    <option value="women's">Женские</option>
                    <option value="unisex">Унисекс</option>
                </select>
                <textarea id="product-description" class="bg-white bg-opacity-20 border-none rounded-md p-3 w-full mb-4 text-white placeholder-gray-300" placeholder="Описание"></textarea>
                <input type="number" id="product-price" class="bg-white bg-opacity-20 border-none rounded-md p-3 w-full mb-4 text-white placeholder-gray-300" placeholder="Цена">
                <input type="file" id="product-photo" class="mb-4" accept="image/*">
                <input type="text" id="product-video" class="bg-white bg-opacity-20 border-none rounded-md p-3 w-full mb-4 text-white placeholder-gray-300" placeholder="URL видео (YouTube)">
                <label class="block mb-4">
                    <input type="checkbox" id="product-available" class="mr-2"> Доступен
                </label>
                <label class="block mb-4">
                    <input type="checkbox" id="product-sample" class="mr-2"> Возможен распив
                </label>
                <button onclick="saveProduct()" class="bg-gradient-to-r from-green-400 to-green-600 text-white px-6 py-3 rounded-full w-full hover:from-green-500 hover:to-green-700 transition transform hover:scale-105">Сохранить</button>
            </div>
        </div>

        <!-- Обратная связь -->
        <div id="contact" class="bg-white bg-opacity-10 backdrop-blur-lg rounded-lg shadow-2xl p-6 mb-6 hidden animate-fadeIn">
            <h1 class="text-4xl font-extrabold text-center mb-6 drop-shadow-lg">Обратная связь</h1>
            <p class="text-lg">Свяжитесь с нами: <a href="https://t.me/PerfumeSupport" class="text-blue-300 hover:underline">@PerfumeSupport</a></p>
        </div>
    </div>

    <!-- Навигация -->
    <div class="fixed bottom-0 left-0 right-0 bg-white bg-opacity-95 p-4 flex justify-around shadow-lg">
        <button onclick="showSection('home')" class="nav-button text-2xl text-gray-800 hover:text-blue-600"><i class="fas fa-home"></i></button>
        <button onclick="showSection('catalog')" class="nav-button text-2xl text-gray-800 hover:text-blue-600"><i class="fas fa-th-list"></i></button>
        <button onclick="showSection('cart')" class="nav-button text-2xl text-gray-800 hover:text-blue-600"><i class="fas fa-shopping-cart"></i></button>
        <button onclick="showSection('admin')" class="nav-button text-2xl text-gray-800 hover:text-blue-600"><i class="fas fa-user-shield"></i></button>
        <button onclick="showSection('contact')" class="nav-button text-2xl text-gray-800 hover:text-blue-600"><i class="fas fa-envelope"></i></button>
    </div>

    <script>
        // Вставьте свою конфигурацию Firebase здесь
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        let products = [];
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let editingProductId = null;
        let currentSlide = 0;

        particlesJS('particles-js', {
            particles: {
                number: { value: 80, density: { enable: true, value_area: 800 } },
                color: { value: '#ffffff' },
                shape: { type: 'circle' },
                opacity: { value: 0.5, random: true },
                size: { value: 3, random: true },
                line_linked: { enable: true, distance: 150, color: '#ffffff', opacity: 0.4, width: 1 },
                move: { enable: true, speed: 2, direction: 'none', random: false, straight: false, out_mode: 'out' }
            },
            interactivity: {
                detect_on: 'canvas',
                events: { onhover: { enable: true, mode: 'repulse' }, onclick: { enable: true, mode: 'push' }, resize: true },
                modes: { repulse: { distance: 100, duration: 0.4 }, push: { particles_nb: 4 } }
            },
            retina_detect: true
        });

        // Загрузка товаров из Firestore
        function loadProducts() {
            db.collection('products').get().then(snapshot => {
                products = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderCarousel();
                renderCatalog();
                if (document.getElementById('admin-content').classList.contains('hidden') === false) {
                    searchAdminProducts();
                }
            });
        }

        function showSection(sectionId) {
            const sections = ['home', 'catalog', 'cart', 'admin', 'contact', 'product-details'];
            sections.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.add('hidden');
            });
            document.getElementById(sectionId).classList.remove('hidden');
            if (sectionId === 'home') {
                renderCarousel();
                showSlide(0);
            } else if (sectionId === 'catalog') {
                renderCatalog();
            } else if (sectionId === 'cart') {
                renderCart();
            } else if (sectionId === 'admin') {
                document.getElementById('admin-content').classList.add('hidden');
                document.getElementById('admin-password').value = '';
            }
        }

        function renderCarousel() {
            const carouselInner = document.getElementById('carousel-inner');
            carouselInner.innerHTML = '';
            if (products.length === 0) {
                carouselInner.innerHTML = '<p class="text-center text-white">Нет товаров для отображения</p>';
                return;
            }
            const topProducts = products.slice(0, 10);
            topProducts.forEach(product => {
                const item = document.createElement('div');
                item.className = 'carousel-item text-center';
                item.innerHTML = `
                    <div class="product p-4">
                        <div class="product-inner bg-white bg-opacity-20 rounded-lg shadow-lg p-6">
                            <img src="${product.photo}" alt="${product.name}" class="mb-4 rounded-md w-full h-48 object-cover">
                            <h3 class="text-2xl font-bold text-white drop-shadow-md">${product.name}</h3>
                            <p class="text-gray-200">${product.description}</p>
                            <p class="text-green-300 font-bold mt-2 text-xl">Цена: ${product.price} руб.</p>
                            <button onclick="viewProduct('${product.id}')" class="bg-gradient-to-r from-blue-400 to-blue-600 text-white px-6 py-2 rounded-full mt-4 hover:from-blue-500 hover:to-blue-700 transition transform hover:scale-105">Подробнее</button>
                        </div>
                    </div>
                `;
                carouselInner.appendChild(item);
            });
            updateCarousel();
        }

        function showSlide(index) {
            const slides = document.querySelectorAll('.carousel-item');
            if (index >= slides.length) index = 0;
            if (index < 0) index = slides.length - 1;
            currentSlide = index;
            updateCarousel();
        }

        function slide(direction) {
            showSlide(currentSlide + direction);
        }

        function updateCarousel() {
            const carouselInner = document.getElementById('carousel-inner');
            carouselInner.style.transform = `translateX(-${currentSlide * 100}%)`;
        }

        function renderCatalog() {
            const productList = document.getElementById('product-list');
            productList.innerHTML = '';
            if (products.length === 0) {
                productList.innerHTML = '<p class="text-center text-white">Нет товаров для отображения</p>';
                return;
            }
            const filteredProducts = getFilteredProducts();
            filteredProducts.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product';
                card.innerHTML = `
                    <div class="product-inner bg-white bg-opacity-20 rounded-lg shadow-lg p-6">
                        <img src="${product.photo}" alt="${product.name}" class="mb-4 rounded-md w-full h-48 object-cover">
                        <h3 class="text-xl font-bold text-white drop-shadow-md">${product.name}</h3>
                        <p class="text-gray-200">${product.description}</p>
                        <p class="text-green-300 font-bold mt-2">Цена: ${product.price} руб.</p>
                        <button onclick="viewProduct('${product.id}')" class="bg-gradient-to-r from-blue-400 to-blue-600 text-white px-4 py-2 rounded-full mt-4 hover:from-blue-500 hover:to-blue-700 transition transform hover:scale-105">Подробнее</button>
                    </div>
                `;
                productList.appendChild(card);
            });
        }

        function getFilteredProducts() {
            const search = document.getElementById('search').value.toLowerCase();
            const category = document.getElementById('category').value;
            return products.filter(product => {
                const matchesSearch = product.name.toLowerCase().includes(search) || product.description.toLowerCase().includes(search);
                const matchesCategory = category === '' || product.category === category;
                return matchesSearch && matchesCategory;
            });
        }

        function filterProducts() {
            renderCatalog();
        }

        function viewProduct(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;
            document.getElementById('catalog').classList.add('hidden');
            document.getElementById('product-details').classList.remove('hidden');
            const productInfo = document.getElementById('product-info');
            const videoId = getYouTubeId(product.video);
            productInfo.innerHTML = `
                <img src="${product.photo}" alt="${product.name}" class="w-full max-w-md mx-auto rounded-md mb-4">
                <h2 class="text-3xl font-bold text-white drop-shadow-md mb-4">${product.name}</h2>
                <p class="text-lg">Категория: ${product.category === 'men\'s' ? 'Мужские' : product.category === 'women\'s' ? 'Женские' : 'Унисекс'}</p>
                <p class="text-lg">${product.description}</p>
                <p class="text-lg text-green-300 font-bold">Цена: ${product.price} руб.</p>
                <p class="text-lg">Доступен: ${product.available ? 'Да' : 'Нет'}</p>
                <p class="text-lg">Возможен распив: ${product.sample ? 'Да' : 'Нет'}</p>
                ${videoId ? `<iframe width="100%" height="315" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen class="mt-4 rounded-md"></iframe>` : ''}
                <button onclick="addToCart('${product.id}')" class="bg-gradient-to-r from-green-400 to-green-600 text-white px-6 py-3 rounded-full mt-6 w-full hover:from-green-500 hover:to-green-700 transition transform hover:scale-105">Добавить в корзину</button>
            `;
        }

        function getYouTubeId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function backToCatalog() {
            document.getElementById('product-details').classList.add('hidden');
            document.getElementById('catalog').classList.remove('hidden');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;
            if (product.sample) {
                const volume = prompt("Введите объем (1-50 мл):");
                if (volume && !isNaN(volume) && volume >= 1 && volume <= 50) {
                    cart.push({ product, volume: parseInt(volume) });
                    localStorage.setItem('cart', JSON.stringify(cart));
                    alert('Товар добавлен в корзину!');
                } else {
                    alert('Неверный объем');
                }
            } else {
                cart.push({ product, volume: null });
                localStorage.setItem('cart', JSON.stringify(cart));
                alert('Товар добавлен в корзину!');
            }
        }

        function renderCart() {
            const cartItemsDiv = document.getElementById('cart-items');
            cartItemsDiv.innerHTML = '';
            cart.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'flex items-center justify-between bg-white bg-opacity-20 p-4 rounded-md mb-2 transform hover:scale-102 transition';
                itemDiv.innerHTML = `
                    <img src="${item.product.photo}" alt="${item.product.name}" class="w-16 h-16 object-cover rounded-md">
                    <p class="text-white">${item.product.name} - ${item.product.price} руб. ${item.volume ? `(${item.volume} мл)` : ''}</p>
                    <button onclick="removeFromCart(${index})" class="bg-gradient-to-r from-red-400 to-red-600 text-white px-3 py-1 rounded-full hover:from-red-500 hover:to-red-700 transition">Удалить</button>
                `;
                cartItemsDiv.appendChild(itemDiv);
            });
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        function sendOrder() {
            if (cart.length === 0) {
                alert('Корзина пуста');
                return;
            }
            const orderText = "Новый заказ:\n" + cart.map(item => `${item.product.name} - ${item.product.price} руб. ${item.volume ? `(${item.volume} мл)` : ''}`).join('\n');
            const telegramToken = 'YOUR_TELEGRAM_BOT_TOKEN';
            const chatId = 'YOUR_CHAT_ID';
            const url = `https://api.telegram.org/bot${telegramToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(orderText)}`;
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.ok) {
                        alert('Заказ успешно отправлен!');
                        cart = [];
                        localStorage.setItem('cart', JSON.stringify(cart));
                        showSection('home');
                    } else {
                        alert('Ошибка отправки заказа');
                    }
                })
                .catch(error => alert('Ошибка: ' + error));
        }

        function loginAdmin() {
            const password = document.getElementById('admin-password').value;
            if (password === 'Ovik2025!') {
                document.getElementById('admin-content').classList.remove('hidden');
                document.getElementById('admin-search').value = '';
                searchAdminProducts();
            } else {
                alert('Неверный пароль');
            }
        }

        function searchAdminProducts() {
            const searchValue = document.getElementById('admin-search').value.toLowerCase();
            const filteredProducts = products.filter(product => product.name.toLowerCase().includes(searchValue));
            renderFilteredAdminProducts(filteredProducts);
        }

        function renderFilteredAdminProducts(filteredProducts) {
            const adminProductsDiv = document.getElementById('admin-products');
            adminProductsDiv.innerHTML = '';
            filteredProducts.forEach(product => {
                const productDiv = document.createElement('div');
                productDiv.className = 'flex items-center justify-between bg-white bg-opacity-20 p-4 rounded-md mb-2';
                productDiv.innerHTML = `
                    <img src="${product.photo}" alt="${product.name}" class="w-12 h-12 object-cover rounded-md">
                    <p class="text-white">${product.name} - ${product.price} руб.</p>
                    <div>
                        <button onclick="editProduct('${product.id}')" class="bg-gradient-to-r from-yellow-400 to-yellow-600 text-white px-3 py-1 rounded-full mr-2 hover:from-yellow-500 hover:to-yellow-700 transition">Редактировать</button>
                        <button onclick="deleteProduct('${product.id}')" class="bg-gradient-to-r from-red-400 to-red-600 text-white px-3 py-1 rounded-full hover:from-red-500 hover:to-red-700 transition">Удалить</button>
                    </div>
                `;
                adminProductsDiv.appendChild(productDiv);
            });
        }

        function saveProduct() {
            const name = document.getElementById('product-name').value;
            const category = document.getElementById('product-category').value;
            const description = document.getElementById('product-description').value;
            const price = parseFloat(document.getElementById('product-price').value);
            const video = document.getElementById('product-video').value;
            const available = document.getElementById('product-available').checked;
            const sample = document.getElementById('product-sample').checked;
            const fileInput = document.getElementById('product-photo');
            const file = fileInput.files[0];

            if (!name || !category || !description || !price) {
                alert('Заполните все обязательные поля');
                return;
            }

            const uploadImage = (file) => {
                return new Promise((resolve, reject) => {
                    if (!file) {
                        resolve(null);
                        return;
                    }
                    const storageRef = storage.ref(`products/${Date.now()}_${file.name}`);
                    const uploadTask = storageRef.put(file);
                    uploadTask.on('state_changed', null, reject, () => {
                        uploadTask.snapshot.ref.getDownloadURL().then(resolve).catch(reject);
                    });
                });
            };

            uploadImage(file).then(photoUrl => {
                const productData = {
                    name,
                    category,
                    description,
                    price,
                    video,
                    available,
                    sample,
                    photo: photoUrl || (editingProductId ? products.find(p => p.id === editingProductId).photo : '')
                };
                if (editingProductId) {
                    db.collection('products').doc(editingProductId).update(productData).then(() => {
                        alert('Товар обновлен');
                        loadProducts();
                        resetProductForm();
                    }).catch(error => alert('Ошибка обновления: ' + error));
                } else {
                    db.collection('products').add(productData).then(() => {
                        alert('Товар добавлен');
                        loadProducts();
                        resetProductForm();
                    }).catch(error => alert('Ошибка добавления: ' + error));
                }
            }).catch(error => alert('Ошибка загрузки изображения: ' + error));
        }

        function editProduct(productId) {
            const product = products.find(p => p.id === productId);
            if (product) {
                document.getElementById('product-name').value = product.name;
                document.getElementById('product-category').value = product.category;
                document.getElementById('product-description').value = product.description;
                document.getElementById('product-price').value = product.price;
                document.getElementById('product-video').value = product.video;
                document.getElementById('product-available').checked = product.available;
                document.getElementById('product-sample').checked = product.sample;
                editingProductId = productId;
            }
        }

        function deleteProduct(productId) {
            if (confirm('Удалить товар?')) {
                const product = products.find(p => p.id === productId);
                if (product.photo) {
                    const photoRef = storage.refFromURL(product.photo);
                    photoRef.delete().catch(error => console.error('Ошибка удаления фото:', error));
                }
                db.collection('products').doc(productId).delete().then(() => {
                    alert('Товар удален');
                    loadProducts();
                }).catch(error => alert('Ошибка удаления: ' + error));
            }
        }

        function resetProductForm() {
            document.getElementById('product-name').value = '';
            document.getElementById('product-category').value = '';
            document.getElementById('product-description').value = '';
            document.getElementById('product-price').value = '';
            document.getElementById('product-video').value = '';
            document.getElementById('product-available').checked = false;
            document.getElementById('product-sample').checked = false;
            document.getElementById('product-photo').value = '';
            editingProductId = null;
        }

        loadProducts();
        showSection('home');
    </script>
</body>
</html>
