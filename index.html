<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин в Telegram</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #006A4E, #004d38); /* RAL 6016 gradient */
            color: #ffffff; /* White text for contrast */
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.8s ease-out;
        }
        .product {
            perspective: 1000px;
            transition: transform 0.4s ease;
        }
        .product-inner {
            transform-style: preserve-3d;
            transition: transform 0.4s ease;
        }
        .product:hover .product-inner {
            transform: rotateY(10deg) scale(1.05);
        }
        .product img {
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
        }
        .carousel {
            overflow: hidden;
            position: relative;
        }
        .carousel-inner {
            display: flex;
            transition: transform 0.5s ease;
        }
        .carousel-item {
            min-width: 100%;
            box-sizing: border-box;
        }
        .btn-slide {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            padding: 10px;
            border-radius: 50%;
            color: white;
        }
        .btn-slide:hover {
            background: rgba(255,255,255,0.4);
        }
        /* Button styles for contrast */
        button {
            background: linear-gradient(90deg, #ffffff, #f0f0f0);
            color: #006A4E;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        /* Admin panel inputs */
        input, textarea {
            background: rgba(255, 255, 255, 0.8);
            color: #333;
            border: none;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <div class="container mx-auto p-4 max-w-5xl relative">
        <div id="catalog" class="bg-white bg-opacity-10 backdrop-blur-lg rounded-lg shadow-2xl p-6 mb-6 animate-fadeIn">
            <h1 class="text-4xl font-extrabold text-center mb-6 drop-shadow-lg">Каталог товаров</h1>
            <div class="carousel">
                <div id="products" class="carousel-inner"></div>
                <button onclick="slide(-1)" class="btn-slide left-0">❮</button>
                <button onclick="slide(1)" class="btn-slide right-0">❯</button>
            </div>
        </div>

        <div id="cart" class="bg-white bg-opacity-10 backdrop-blur-lg rounded-lg shadow-2xl p-6 mb-6 hidden animate-fadeIn">
            <h1 class="text-4xl font-extrabold text-center mb-6 drop-shadow-lg">Корзина</h1>
            <div id="cart-items" class="space-y-4"></div>
            <button onclick="sendOrder()" class="w-full py-3 mt-6 rounded-lg">Отправить заказ</button>
        </div>

        <div id="admin" class="bg-white bg-opacity-10 backdrop-blur-lg rounded-lg shadow-2xl p-6 mb-6 hidden animate-fadeIn">
            <h1 class="text-4xl font-extrabold text-center mb-6 drop-shadow-lg">Админ-панель</h1>
            <input type="password" id="admin-password" class="w-full p-3 rounded-md mb-4" placeholder="Пароль">
            <button onclick="loginAdmin()" class="w-full py-3 rounded-md">Войти</button>
            <div id="admin-content" class="hidden mt-6">
                <h2 class="text-2xl font-bold mb-4">Добавить/Редактировать товар</h2>
                <input type="text" id="product-name" class="w-full p-3 rounded-md mb-4" placeholder="Название">
                <textarea id="product-description" class="w-full p-3 rounded-md mb-4" placeholder="Описание"></textarea>
                <input type="number" id="product-price" class="w-full p-3 rounded-md mb-4" placeholder="Цена">
                <input type="file" id="product-image" class="mb-4" accept="image/*">
                <button onclick="saveProduct()" class="w-full py-3 rounded-md">Сохранить</button>
                <h2 class="text-2xl font-bold mt-6 mb-4">Список товаров</h2>
                <div id="admin-products" class="space-y-4"></div>
            </div>
        </div>

        <div class="flex justify-around mt-6">
            <button onclick="showCatalog()" class="py-3 px-6 rounded-lg">Каталог</button>
            <button onclick="showCart()" class="py-3 px-6 rounded-lg">Корзина</button>
            <button onclick="showAdmin()" class="py-3 px-6 rounded-lg">Админ-панель</button>
        </div>
    </div>

    <script>
        let products = JSON.parse(localStorage.getItem('products')) || [
            { id: 1, name: 'Парфюм "Летний бриз"', description: 'Свежий аромат с нотами моря и цитрусовых.', price: 1200, image: 'https://via.placeholder.com/300?text=Летний+бриз' },
            { id: 2, name: 'Парфюм "Тёмная роза"', description: 'Глубокий цветочный аромат с оттенками розы и ванили.', price: 1800, image: 'https://via.placeholder.com/300?text=Тёмная+роза' },
            { id: 3, name: 'Парфюм "Золотой закат"', description: 'Теплый и пряный аромат с нотами амбры и сандала.', price: 2500, image: 'https://via.placeholder.com/300?text=Золотой+закат' }
        ];
        let cart = [];
        let editingProductId = null;
        let currentSlide = 0;

        particlesJS('particles-js', {
            particles: {
                number: { value: 80, density: { enable: true, value_area: 800 } },
                color: { value: '#ffffff' },
                shape: { type: 'circle' },
                opacity: { value: 0.5, random: true },
                size: { value: 3, random: true },
                line_linked: { enable: true, distance: 150, color: '#ffffff', opacity: 0.4, width: 1 },
                move: { enable: true, speed: 2, direction: 'none', random: false, straight: false, out_mode: 'out' }
            },
            interactivity: {
                detect_on: 'canvas',
                events: { onhover: { enable: true, mode: 'repulse' }, onclick: { enable: true, mode: 'push' }, resize: true },
                modes: { repulse: { distance: 100, duration: 0.4 }, push: { particles_nb: 4 } }
            },
            retina_detect: true
        });

        function saveProducts() {
            localStorage.setItem('products', JSON.stringify(products));
        }

        function showCatalog() {
            document.getElementById('catalog').classList.remove('hidden');
            document.getElementById('cart').classList.add('hidden');
            document.getElementById('admin').classList.add('hidden');
            renderProducts();
        }

        function showCart() {
            document.getElementById('catalog').classList.add('hidden');
            document.getElementById('cart').classList.remove('hidden');
            document.getElementById('admin').classList.add('hidden');
            renderCart();
        }

        function showAdmin() {
            document.getElementById('catalog').classList.add('hidden');
            document.getElementById('cart').classList.add('hidden');
            document.getElementById('admin').classList.remove('hidden');
        }

        function renderProducts() {
            const productsDiv = document.getElementById('products');
            productsDiv.innerHTML = '';
            products.forEach(product => {
                const productDiv = document.createElement('div');
                productDiv.className = 'carousel-item product p-4 text-center';
                productDiv.innerHTML = `
                    <div class="product-inner bg-white bg-opacity-20 rounded-lg shadow-lg p-6">
                        <img src="${product.image}" alt="${product.name}" class="mb-4 rounded-md w-full h-48 object-cover">
                        <h3 class="text-2xl font-bold drop-shadow-md">${product.name}</h3>
                        <p>${product.description}</p>
                        <p class="text-green-300 font-bold mt-2 text-xl">Цена: ${product.price} руб.</p>
                        <button onclick="addToCart(${product.id})" class="mt-4 py-2 px-4 rounded-lg">Добавить в корзину</button>
                    </div>
                `;
                productsDiv.appendChild(productDiv);
            });
            updateCarousel();
        }

        function slide(direction) {
            currentSlide += direction;
            if (currentSlide < 0) currentSlide = products.length - 1;
            if (currentSlide >= products.length) currentSlide = 0;
            updateCarousel();
        }

        function updateCarousel() {
            const productsDiv = document.getElementById('products');
            productsDiv.style.transform = `translateX(-${currentSlide * 100}%)`;
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (product) {
                cart.push(product);
                alert('Товар добавлен в корзину!');
                renderCart();
            }
        }

        function renderCart() {
            const cartItemsDiv = document.getElementById('cart-items');
            cartItemsDiv.innerHTML = '';
            cart.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'flex items-center justify-between bg-white bg-opacity-20 p-4 rounded-md mb-2 transform hover:scale-102 transition';
                itemDiv.innerHTML = `
                    <img src="${item.image}" alt="${item.name}" class="w-16 h-16 object-cover rounded-md">
                    <p>${item.name} - ${item.price} руб.</p>
                `;
                cartItemsDiv.appendChild(itemDiv);
            });
        }

        function sendOrder() {
            if (cart.length === 0) {
                alert('Корзина пуста');
                return;
            }
            const orderText = "Новый заказ:\n" + cart.map(item => `${item.name} - ${item.price} руб.`).join('\n');
            const telegramToken = 'YOUR_TELEGRAM_BOT_TOKEN'; // Замените на ваш токен бота
            const chatId = 'YOUR_CHAT_ID'; // Замените на ваш ID чата
            const url = `https://api.telegram.org/bot${telegramToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(orderText)}`;
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.ok) {
                        alert('Заказ успешно отправлен!');
                        cart = [];
                        showCatalog();
                    } else {
                        alert('Ошибка отправки заказа');
                    }
                })
                .catch(error => alert('Ошибка: ' + error));
        }

        function loginAdmin() {
            const password = document.getElementById('admin-password').value;
            if (password === 'admin123') {
                document.getElementById('admin-content').classList.remove('hidden');
                renderAdminProducts();
            } else {
                alert('Неверный пароль');
            }
        }

        function renderAdminProducts() {
            const adminProductsDiv = document.getElementById('admin-products');
            adminProductsDiv.innerHTML = '';
            products.forEach(product => {
                const productDiv = document.createElement('div');
                productDiv.className = 'flex items-center justify-between bg-white bg-opacity-20 p-4 rounded-md mb-2';
                productDiv.innerHTML = `
                    <img src="${product.image}" alt="${product.name}" class="w-12 h-12 object-cover rounded-md">
                    <p>${product.name} - ${product.price} руб.</p>
                    <div>
                        <button onclick="editProduct(${product.id})" class="bg-yellow-400 text-black px-3 py-1 rounded-full mr-2">Редактировать</button>
                        <button onclick="deleteProduct(${product.id})" class="bg-red-400 text-black px-3 py-1 rounded-full">Удалить</button>
                    </div>
                `;
                adminProductsDiv.appendChild(productDiv);
            });
        }

        function saveProduct() {
            const name = document.getElementById('product-name').value;
            const description = document.getElementById('product-description').value;
            const price = document.getElementById('product-price').value;
            const fileInput = document.getElementById('product-image');
            const file = fileInput.files[0];

            if (!name || !description || !price) {
                alert('Заполните все поля');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const image = e.target.result;
                if (editingProductId) {
                    const productIndex = products.findIndex(p => p.id === editingProductId);
                    products[productIndex] = { id: editingProductId, name, description, price, image: image || products[productIndex].image };
                } else {
                    const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
                    products.push({ id: newId, name, description, price, image });
                }
                saveProducts();
                renderAdminProducts();
                alert('Товар сохранен');
                resetProductForm();
            };
            if (file) {
                reader.readAsDataURL(file);
            } else if (editingProductId) {
                const product = products.find(p => p.id === editingProductId);
                reader.onload({ target: { result: product.image } });
            } else {
                alert('Выберите изображение');
            }
        }

        function editProduct(productId) {
            const product = products.find(p => p.id === productId);
            if (product) {
                document.getElementById('product-name').value = product.name;
                document.getElementById('product-description').value = product.description;
                document.getElementById('product-price').value = product.price;
                editingProductId = productId;
            }
        }

        function deleteProduct(productId) {
            if (confirm('Удалить товар?')) {
                products = products.filter(p => p.id !== productId);
                saveProducts();
                renderAdminProducts();
            }
        }

        function resetProductForm() {
            document.getElementById('product-name').value = '';
            document.getElementById('product-description').value = '';
            document.getElementById('product-price').value = '';
            document.getElementById('product-image').value = '';
            editingProductId = null;
        }

        showCatalog();
    </script>
</body>
</html>
